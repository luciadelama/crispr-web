services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    image: crispr-frontend
    expose:
      - "80"
    networks:
      - crispr
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    image: crispr-admin
    expose:
      - "80"
    networks:
      - crispr
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: crispr-backend
    expose:
      - "4000"
    env_file:
      - ./backend/.env.production
    networks:
      - crispr

networks:
  crispr:
    driver: bridge