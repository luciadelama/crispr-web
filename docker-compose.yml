services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL= http://localhost:4000/api
    networks:
      - crispr
    depends_on:
      - backend
  admin:
    build: 
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL= http://localhost:4000/api
    networks:
      - crispr
    depends_on:
      - backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    networks:
      - crispr
    env_file:
      - ./backend/.env.development

networks:
  crispr:
    driver: bridge